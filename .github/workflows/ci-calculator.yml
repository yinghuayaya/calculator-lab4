name: Java Calculator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: pom.xml

      - name: Check Maven dependencies
        run: |
          mkdir -p ci-logs
          mvn -B -ntp dependency:resolve dependency:tree 2>&1 | tee ci-logs/dependencies.log

      - name: Maven Compile
        run: mvn -B -ntp clean compile 2>&1 | tee ci-logs/compile.log

      - name: Maven Test
        run: mvn -B -ntp test 2>&1 | tee ci-logs/test.log

      - name: Preserve Maven logs and JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: calculator-jdk-${{ matrix.java }}-results
          path: |
            ci-logs/
            target/surefire-reports/
            target/jacoco.exec
          retention-days: 90

  docker:
    name: Build and verify Docker image (JDK 17)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          mkdir -p ci-logs
          docker build --progress=plain -t calculator:v1 . 2>&1 | tee ci-logs/docker-build.log

      - name: Verify container arithmetic
        run: |
          docker images calculator:v1 | tee ci-logs/docker-images.log
          bash scripts/verify-container.sh 2>&1 | tee ci-logs/container-test.log

      - name: Preserve Docker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: calculator-docker-results
          path: ci-logs/
          retention-days: 90
